name: PokeTokenBar
options:
  bundleIdPrefix: io.github.chattymin
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false
  # iOS app + widget string catalogs (Mac app localizes via Localization.swift instead).
  developmentLanguage: en
  localizations: [en, ko, ja, es]

packages:
  PokeTokenBarShared:
    path: PokeTokenBarShared

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:

  # ── macOS App (existing SPM executable, wrapped as Xcode target) ──
  PokeTokenBar:
    type: application
    platform: macOS
    sources:
      - Sources/PokeTokenBar
    entitlements:
      path: Sources/PokeTokenBar/PokeTokenBar.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.chattymin.poketokenbar
        com.apple.developer.icloud-container-identifiers:
          - iCloud.io.github.chattymin.poketokenbar
        com.apple.developer.icloud-services:
          - CloudKit
    dependencies:
      - package: PokeTokenBarShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.chattymin.poketokenbar
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: B2G47QWXN7
        PRODUCT_NAME: PokeTokenBar
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        Release:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts: []
    linkerSettings:
      - sdk: sqlite3

  # ── iOS App ──
  PokeTokenBariOS:
    type: application
    platform: iOS
    sources:
      - PokeTokenBariOS/Sources
      - path: PokeTokenBariOS/Resources/Assets.xcassets
        type: folder.assetCatalog
      - path: PokeTokenBariOS/Resources/Localizable.xcstrings
    entitlements:
      path: PokeTokenBariOS/PokeTokenBariOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.chattymin.poketokenbar
          - group.com.poketokenbar.ios.widget
        com.apple.developer.icloud-container-identifiers:
          - iCloud.io.github.chattymin.poketokenbar
        com.apple.developer.icloud-services:
          - CloudKit
    dependencies:
      - package: PokeTokenBarShared
      - target: PokeTokenBarWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.poketokenbar.ios
        INFOPLIST_FILE: PokeTokenBariOS/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: B2G47QWXN7
        PRODUCT_NAME: "PokeTokenBar"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        SWIFT_EMIT_LOC_STRINGS: YES

  # ── Widget Extension ──
  PokeTokenBarWidget:
    type: app-extension
    platform: iOS
    sources:
      - PokeTokenBarWidget/Sources
      - path: PokeTokenBarWidget/Resources/Localizable.xcstrings
      # 자산 카탈로그는 folder.assetCatalog 로 명시해야 리소스 빌드 페이즈가 생긴다.
      # `resources:` 키만 쓰면 PBXResourcesBuildPhase 가 아예 생성되지 않는다 — defect-log 참조.
      - path: PokeTokenBarWidget/Resources/Assets.xcassets
        type: folder.assetCatalog
    entitlements:
      path: PokeTokenBarWidget/PokeTokenBarWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.chattymin.poketokenbar
          - group.com.poketokenbar.ios.widget
        com.apple.developer.icloud-container-identifiers:
          - iCloud.io.github.chattymin.poketokenbar
        com.apple.developer.icloud-services:
          - CloudKit
    dependencies:
      - package: PokeTokenBarShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.poketokenbar.ios.widget
        INFOPLIST_FILE: PokeTokenBarWidget/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: B2G47QWXN7
        PRODUCT_NAME: "$(TARGET_NAME)"
        SKIP_INSTALL: true
        GENERATE_INFOPLIST_FILE: false
        SWIFT_EMIT_LOC_STRINGS: YES

groups:
  - name: iOS App
    path: PokeTokenBariOS
  - name: Widget
    path: PokeTokenBarWidget
  - name: Shared
    path: PokeTokenBarShared
  - name: macOS App
    path: Sources/PokeTokenBar
